# RT-DETRv2-S (r18vd) - fine-tuning para detección de matrículas (1 clase)
# Lanzar desde C:\Uni\VC\practicasVC\P4 (una sola GPU, sin torchrun):
#   python RT-DETR/rtdetrv2_pytorch/tools/train.py -c configs/rtdetrv2_r18vd_120e_coco.yml --use-amp --seed 0
# (--use-amp es obligatorio: si no se pasa, train.py sobrescribe use_amp a False)

__include__: [
  './coco_detection.yml',                                                   # dataset propio, num_classes: 1
  '../RT-DETR/rtdetrv2_pytorch/configs/runtime.yml',
  '../RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/dataloader.yml',
  '../RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/optimizer.yml',
  '../RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/rtdetrv2_r50vd.yml',
]

output_dir: C:\UNI\VC\practicasVC\P4\output\res_800

# Fine-tuning desde el checkpoint COCO; las capas de la cabeza de 80 clases se descartan solas
tuning: C:\Uni\VC\practicasVC\P4\weights\rtdetrv2_r18vd_120e_coco_rerun_48.1.pth

print_freq: 10          # ~364 iteraciones por época (1458 imágenes de train / lote 4)
checkpoint_freq: 10     # best.pth y last.pth se guardan siempre
eval_spatial_size: [800, 800]

PResNet:
  depth: 18
  freeze_at: -1
  freeze_norm: True
  pretrained: False     # el backbone ya viene en el checkpoint de tuning


HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5


RTDETRTransformerv2:
  num_layers: 3
  num_queries: 100

RTDETRPostProcessor:
  num_top_queries: 100

epoches: 50

use_amp: True
use_ema: True
ema:
  type: ModelEMA
  decay: 0.9998         # ventana efectiva ~5000 iteraciones (~14 épocas) de las ~18 200 totales
  warmups: 1500

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.0000025
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.0000025
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.
  lr: 0.000025            # lr de encoder y decoder con lote 4; el backbone usa 10 veces menos (arriba)
  betas: [0.9, 0.999]
  weight_decay: 0.0001

lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 1500  # ~4 épocas (364 iteraciones por época)


train_dataloader:
  total_batch_size: 4
  num_workers: 4        # si Windows da problemas de multiprocessing, bajar a 0
  dataset:
    transforms:
      ops:              # los del repo, sin RandomHorizontalFlip
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: Resize, size: [800, 800], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: 47       # últimas 3 épocas sin aumentos (como 117/120 en el original)
  collate_fn:
    scales: ~           # sin multiescala: siempre 800x800

val_dataloader:
  num_workers: 4
  total_batch_size: 8        # lote de validación (sin gradientes, cabe el doble)
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [800, 800], }
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
